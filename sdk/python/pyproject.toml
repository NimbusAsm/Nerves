[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nerves-sdk"
version = "0.1.0"
description = "Chainable Python client for the Nerves account center management API."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Nerves contributors" }]
keywords = ["nerves", "identity", "account-center", "sdk"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/NimbusAsm/Nerves"

[tool.hatch.build.targets.wheel]
packages = ["src/nerves"]

[tool.hatch.build.targets.sdist]
include = ["src/nerves", "tests", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
