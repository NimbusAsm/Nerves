name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Format
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        run: dotnet build --no-restore -warnaserror

      - name: Test
        run: dotnet test --no-build

      - name: Pack SDK
        run: dotnet pack sdk/dotnet/Nerves.Client/Nerves.Client.csproj -c Release -o artifacts/packages

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.75.0'

      - name: Lint protobuf
        run: buf lint

      - name: Check protobuf compatibility
        if: github.event_name == 'pull_request'
        run: buf breaking --against '.git#branch=main'

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: |
            apps/admin/pnpm-lock.yaml
            sdk/typescript/pnpm-lock.yaml

      - name: Admin console
        working-directory: apps/admin
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm test

      - name: TypeScript SDK
        working-directory: sdk/typescript
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm typecheck
          pnpm test

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install and test Python SDK
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "sdk/python[dev]"
          python -m pytest sdk/python -q

