name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # Lets the OpenAPI compatibility gate download the archived documents from the
  # latest successful run on main.
  actions: read

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Format
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        run: dotnet build --no-restore -warnaserror

      - name: Test
        run: dotnet test --no-build

      - name: Check for vulnerable packages
        run: dotnet list package --vulnerable --include-transitive --format json > vulnerabilities.json

      - name: Fail on known vulnerabilities
        run: |
          python3 - <<'PYCODE'
          import json
          import sys
          data = json.load(open("vulnerabilities.json"))
          found = []
          for project in data.get("projects", []):
              for framework in project.get("frameworks", []):
                  for package in framework.get("transitivePackages", []) + framework.get("topLevelPackages", []):
                      if package.get("vulnerabilities"):
                          found.append((project["path"], package["id"]))
          if found:
              for project, package in found:
                  print(f"vulnerable: {package} in {project}")
              sys.exit(1)
          print("no known vulnerabilities")
          PYCODE

      - name: Pack SDK
        run: dotnet pack sdk/dotnet/Nerves.Client/Nerves.Client.csproj -c Release -o artifacts/packages

      - name: Install buf
        run: |
          npx --yes @bufbuild/buf@1.75.0 --version
          echo "BUF=npx --yes @bufbuild/buf@1.75.0" >> "$GITHUB_ENV"

      - name: Lint protobuf
        run: $BUF lint

      - name: Fetch base branch
        if: github.event_name == 'pull_request'
        run: git fetch origin main --depth=1

      - name: Check protobuf compatibility
        if: github.event_name == 'pull_request'
        run: $BUF breaking --against '.git#branch=origin/main'

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build every service image
        run: |
          set -euo pipefail
          for svc in Gateway Idp Identity Session Authorization Directory Audit ComplianceCn Notification; do
            echo "::group::Building $svc"
            docker build \
              -f deploy/docker/Dockerfile \
              --build-arg PROJECT=src/services/Nerves.$svc/Nerves.$svc.csproj \
              --build-arg ENTRY_DLL=Nerves.$svc.dll \
              -t "nerves-$(echo "$svc" | tr '[:upper:]' '[:lower:]'):ci" .
            docker run --rm --entrypoint dotnet \
              "nerves-$(echo "$svc" | tr '[:upper:]' '[:lower:]'):ci" --info >/dev/null
            echo "::endgroup::"
          done

          echo "::group::Building admin"
          docker build -f apps/admin/Dockerfile -t nerves-admin:ci \
            --build-arg VITE_USE_MOCK=false apps/admin
          docker run --rm --entrypoint nginx nerves-admin:ci -v
          echo "::endgroup::"

      - name: Install Trivy
        run: |
          curl -sSfL -o trivy.tgz \
            https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-64bit.tar.gz
          tar xzf trivy.tgz trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy
          trivy --version

      - name: Scan images for high and critical vulnerabilities
        env:
          # Unfixed findings are not actionable at build time, and the reviewed
          # baseline keeps the gate blocking only on new findings.
          TRIVY_IGNORE_UNFIXED: '1'
          TRIVY_IGNOREFILE: deploy/security/trivyignore
        run: |
          set -euo pipefail
          for svc in Gateway Idp Identity Session Authorization Directory Audit ComplianceCn Notification; do
            scripts/scan-image.sh "nerves-$(echo "$svc" | tr '[:upper:]' '[:lower:]'):ci"
          done
          scripts/scan-image.sh nerves-admin:ci

      - name: Install Syft
        run: |
          curl -sSfL -o syft.tgz \
            https://github.com/anchore/syft/releases/download/v1.57.1/syft_1.57.1_linux_amd64.tar.gz
          tar xzf syft.tgz syft
          sudo install -m 0755 syft /usr/local/bin/syft
          syft version

      - name: Generate SBOMs
        run: |
          set -euo pipefail
          for svc in Gateway Idp Identity Session Authorization Directory Audit ComplianceCn Notification; do
            scripts/sbom.sh "nerves-$(echo "$svc" | tr '[:upper:]' '[:lower:]'):ci" artifacts/sbom
          done
          scripts/sbom.sh nerves-admin:ci artifacts/sbom

      - name: Upload SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: artifacts/sbom
          if-no-files-found: error
          retention-days: 30

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: nerves
          POSTGRES_PASSWORD: nerves
          POSTGRES_DB: nerves
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nerves -d nerves"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Install k6
        run: |
          curl -sSfL -o k6.tgz \
            https://github.com/grafana/k6/releases/download/v2.3.0/k6-v2.3.0-linux-amd64.tar.gz
          tar xzf k6.tgz
          sudo install -m 0755 "k6-v2.3.0-linux-amd64/k6" /usr/local/bin/k6
          k6 version

      - name: End-to-end smoke
        env:
          E2E_DB_HOST: 127.0.0.1
          E2E_DB_PORT: '5432'
          E2E_DB_DATABASE: nerves
          E2E_DB_USER: nerves
          E2E_DB_PASSWORD: nerves
          E2E_PORT_BASE: '5100'
          E2E_LOG_DIR: ${{ runner.temp }}/e2e-logs
          # The stack is still running when these probes execute; both are
          # report-only and never fail the job.
          E2E_COLLECT_OPENAPI: artifacts/openapi
          E2E_LOAD_SMOKE_URL: http://127.0.0.1:5100/healthz
          E2E_LOAD_SMOKE_DURATION: 30s
        run: bash scripts/e2e-smoke.sh

      - name: Upload OpenAPI documents
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: artifacts/openapi
          if-no-files-found: warn
          retention-days: 30

      - name: Upload service logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: ${{ runner.temp }}/e2e-logs

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: |
            apps/admin/pnpm-lock.yaml
            sdk/typescript/pnpm-lock.yaml

      - name: Admin console
        working-directory: apps/admin
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm test

      - name: TypeScript SDK
        working-directory: sdk/typescript
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm typecheck
          pnpm test

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install and test Python SDK
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "sdk/python[dev]"
          python -m pytest sdk/python -q

  openapi-diff:
    runs-on: ubuntu-latest
    needs: e2e
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - name: Download the OpenAPI documents from this revision
        uses: actions/download-artifact@v4
        with:
          name: openapi
          path: artifacts/openapi

      - name: Download the archived OpenAPI documents from main
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/openapi-main
          run_id="$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow ci.yml \
            --branch main \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')"
          if [[ -z "${run_id}" ]]; then
            echo "archived=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no successful ci run on main yet; the OpenAPI compatibility gate is skipped"
            exit 0
          fi
          if gh run download "${run_id}" \
            --repo "${{ github.repository }}" \
            --name openapi \
            --dir artifacts/openapi-main; then
            echo "archived=true" >> "$GITHUB_OUTPUT"
          else
            echo "archived=false" >> "$GITHUB_OUTPUT"
            echo "::notice::run ${run_id} has no openapi artifact; the compatibility gate is skipped"
          fi

      - name: Install oasdiff
        run: |
          curl -sSfL -o oasdiff.tgz \
            https://github.com/oasdiff/oasdiff/releases/download/v1.37.0/oasdiff_1.37.0_linux_amd64.tar.gz
          tar xzf oasdiff.tgz oasdiff
          sudo install -m 0755 oasdiff /usr/local/bin/oasdiff
          oasdiff --version

      - name: Check OpenAPI compatibility
        run: bash scripts/openapi-diff.sh artifacts/openapi-main artifacts/openapi
