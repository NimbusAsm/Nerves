apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nerves.fullname" . }}-config
  labels:
    {{- include "nerves.labels" (dict "root" . "name" "config") | nindent 4 }}
data:
  ASPNETCORE_ENVIRONMENT: {{ .Values.config.aspnetcoreEnvironment | quote }}
  ASPNETCORE_HTTP_PORTS: "8080"
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.config.otelExporterOtlpEndpoint | quote }}
