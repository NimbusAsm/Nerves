{{- if .Values.admin.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ printf "%s-admin" (include "nerves.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "nerves.labels" (dict "root" . "name" "admin") | nindent 4 }}
  {{- with .Values.admin.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.admin.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with .Values.admin.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.admin.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ include "nerves.serviceFullname" (dict "root" $ "name" "admin") }}
                port:
                  number: {{ $.Values.services.admin.port | default 80 }}
          {{- end }}
    {{- end }}
{{- end }}
