{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nerves.serviceFullname" (dict "root" $ "name" $name) }}
  labels:
    {{- include "nerves.labels" (dict "root" $ "name" $name) | nindent 4 }}
  {{- with $svc.serviceAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $svc.serviceType | default "ClusterIP" }}
  ports:
    - name: http
      port: {{ $svc.port | default 80 }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "nerves.selectorLabels" (dict "root" $ "name" $name) | nindent 4 }}
{{- end }}
{{- end }}
