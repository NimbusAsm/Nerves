{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
{{- $hpaEnabled := and $.Values.autoscaling.enabled (has $name (default (list) $.Values.autoscaling.services)) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nerves.serviceFullname" (dict "root" $ "name" $name) }}
  labels:
    {{- include "nerves.labels" (dict "root" $ "name" $name) | nindent 4 }}
spec:
  {{- if not $hpaEnabled }}
  replicas: {{ $svc.replicaCount | default 1 }}
  {{- end }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "nerves.selectorLabels" (dict "root" $ "name" $name) | nindent 6 }}
  strategy:
    {{- toYaml $.Values.updateStrategy | nindent 4 }}
  template:
    metadata:
      {{- $annotations := merge (dict) (default (dict) $.Values.podAnnotations) (default (dict) $svc.podAnnotations) }}
      {{- if $annotations }}
      annotations:
        {{- toYaml $annotations | nindent 8 }}
      {{- end }}
      labels:
        {{- include "nerves.selectorLabels" (dict "root" $ "name" $name) | nindent 8 }}
        app.kubernetes.io/version: {{ $.Chart.AppVersion | quote }}
        {{- $podLabels := merge (dict) (default (dict) $.Values.commonLabels) (default (dict) $svc.podLabels) }}
        {{- if $podLabels }}
        {{- toYaml $podLabels | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "nerves.serviceAccountName" $ }}
      automountServiceAccountToken: {{ $.Values.serviceAccount.automountServiceAccountToken }}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: {{ $name }}
          image: {{ include "nerves.image" (dict "root" $ "name" $name "svc" $svc) | quote }}
          imagePullPolicy: {{ include "nerves.pullPolicy" (dict "root" $ "svc" $svc) | quote }}
          securityContext:
            {{- toYaml $.Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "nerves.fullname" $ }}-config
            {{- range (default (list) $svc.extraEnvFrom) }}
            - {{ toYaml . | nindent 14 }}
            {{- end }}
          env:
            - name: ConnectionStrings__Default
              valueFrom:
                secretKeyRef:
                  name: {{ include "nerves.databaseSecretName" $ }}
                  key: {{ $.Values.database.secretKey }}
            {{- if or $.Values.nats.enabled $.Values.nats.url $.Values.nats.existingSecret }}
            - name: Nats__Url
              valueFrom:
                secretKeyRef:
                  name: {{ include "nerves.natsSecretName" $ }}
                  key: {{ $.Values.nats.urlSecretKey }}
            {{- end }}
            {{- range (default (list) $svc.extraEnv) }}
            - {{ toYaml . | nindent 14 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: dotnet-data-protection
              mountPath: /home/app/.aspnet
      volumes:
        - name: tmp
          emptyDir: {}
        - name: dotnet-data-protection
          emptyDir: {}
      {{- with $svc.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $svc.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $svc.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
