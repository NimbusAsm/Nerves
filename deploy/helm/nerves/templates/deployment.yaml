{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
{{- $hpaEnabled := and $.Values.autoscaling.enabled (has $name (default (list) $.Values.autoscaling.services)) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nerves.serviceFullname" (dict "root" $ "name" $name) }}
  labels:
    {{- include "nerves.labels" (dict "root" $ "name" $name) | nindent 4 }}
spec:
  {{- if not $hpaEnabled }}
  replicas: {{ $svc.replicaCount | default 1 }}
  {{- end }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "nerves.selectorLabels" (dict "root" $ "name" $name) | nindent 6 }}
  strategy:
    {{- toYaml $.Values.updateStrategy | nindent 4 }}
  template:
    metadata:
      {{- $annotations := merge (dict) (default (dict) $.Values.podAnnotations) (default (dict) $svc.podAnnotations) }}
      {{- if $annotations }}
      annotations:
        {{- toYaml $annotations | nindent 8 }}
      {{- end }}
      labels:
        {{- include "nerves.selectorLabels" (dict "root" $ "name" $name) | nindent 8 }}
        app.kubernetes.io/version: {{ $.Chart.AppVersion | quote }}
        {{- $podLabels := merge (dict) (default (dict) $.Values.commonLabels) (default (dict) $svc.podLabels) }}
        {{- if $podLabels }}
        {{- toYaml $podLabels | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "nerves.serviceAccountName" $ }}
      automountServiceAccountToken: {{ $.Values.serviceAccount.automountServiceAccountToken }}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: {{ $name }}
          image: {{ include "nerves.image" (dict "root" $ "name" $name "svc" $svc) | quote }}
          imagePullPolicy: {{ include "nerves.pullPolicy" (dict "root" $ "svc" $svc) | quote }}
          securityContext:
            {{- toYaml $.Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            {{- with $svc.grpcPort }}
            - name: grpc
              containerPort: {{ . }}
              protocol: TCP
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "nerves.fullname" $ }}-config
            {{- range (default (list) $svc.extraEnvFrom) }}
            - {{ toYaml . | nindent 14 }}
            {{- end }}
          env:
            - name: ConnectionStrings__Default
              valueFrom:
                secretKeyRef:
                  name: {{ include "nerves.databaseSecretName" $ }}
                  key: {{ $.Values.database.secretKey }}
            {{- if or $.Values.nats.enabled $.Values.nats.url $.Values.nats.existingSecret }}
            - name: Nats__Url
              valueFrom:
                secretKeyRef:
                  name: {{ include "nerves.natsSecretName" $ }}
                  key: {{ $.Values.nats.urlSecretKey }}
            {{- end }}
            - name: Kestrel__Endpoints__Http__Url
              value: "http://0.0.0.0:8080"
            {{- with $svc.grpcPort }}
            - name: Kestrel__Endpoints__Grpc__Url
              value: "http://0.0.0.0:{{ . }}"
            - name: Kestrel__Endpoints__Grpc__Protocols
              value: "Http2"
            {{- end }}
            {{- if or (eq $name "identity") (eq $name "idp") }}
            - name: DataProtection__KeysDirectory
              value: /var/lib/nerves/dp-keys
            {{- end }}
            {{- if and (ne $name "gateway") (ne $name "idp") }}
            - name: Authentication__Authority
              value: "http://{{ include "nerves.serviceFullname" (dict "root" $ "name" "idp") }}:{{ (index $.Values.services "idp").port }}"
            - name: Authentication__Issuer
              value: {{ $.Values.config.publicIssuer | quote }}
            - name: Authentication__Audience
              value: {{ $.Values.config.audience | quote }}
            {{- end }}
            {{- if eq $name "idp" }}
            - name: OpenIddict__Issuer
              value: {{ $.Values.config.publicIssuer | quote }}
            {{- range $index, $origin := $.Values.config.adminOrigins }}
            - name: Cors__AdminOrigins__{{ $index }}
              value: {{ $origin | quote }}
            {{- end }}
            {{- if $.Values.seed.enabled }}
            - name: OpenIddictSeed__Enabled
              value: "true"
            - name: OpenIddictSeed__AllowInProduction
              value: {{ $.Values.seed.allowInProduction | quote }}
            {{- range $index, $uri := $.Values.seed.redirectUris }}
            - name: OpenIddictSeed__RedirectUris__{{ $index }}
              value: {{ $uri | quote }}
            {{- end }}
            {{- range $index, $uri := $.Values.seed.postLogoutRedirectUris }}
            - name: OpenIddictSeed__PostLogoutRedirectUris__{{ $index }}
              value: {{ $uri | quote }}
            {{- end }}
            {{- range $index, $uri := $.Values.seed.adminRedirectUris }}
            - name: OpenIddictSeed__AdminRedirectUris__{{ $index }}
              value: {{ $uri | quote }}
            {{- end }}
            {{- end }}
            - name: Identity__GrpcAddress
              value: "http://{{ include "nerves.serviceFullname" (dict "root" $ "name" "identity") }}:{{ (index $.Values.services "identity").grpcPort }}"
            - name: Session__GrpcAddress
              value: "http://{{ include "nerves.serviceFullname" (dict "root" $ "name" "session") }}:{{ (index $.Values.services "session").grpcPort }}"
            - name: Authorization__GrpcAddress
              value: "http://{{ include "nerves.serviceFullname" (dict "root" $ "name" "authorization") }}:{{ (index $.Values.services "authorization").grpcPort }}"
            - name: Audit__GrpcAddress
              value: "http://{{ include "nerves.serviceFullname" (dict "root" $ "name" "audit") }}:{{ (index $.Values.services "audit").grpcPort }}"
            {{- end }}
            {{- if eq $name "gateway" }}
            {{- range $index, $origin := $.Values.config.adminOrigins }}
            - name: Cors__AdminOrigins__{{ $index }}
              value: {{ $origin | quote }}
            {{- end }}
            - name: Gateway__Services__identity
              value: "http://{{ include "nerves.serviceFullname" (dict "root" $ "name" "identity") }}:{{ (index $.Values.services "identity").port }}/"
            - name: Gateway__Services__session
              value: "http://{{ include "nerves.serviceFullname" (dict "root" $ "name" "session") }}:{{ (index $.Values.services "session").port }}/"
            - name: Gateway__Services__authorization
              value: "http://{{ include "nerves.serviceFullname" (dict "root" $ "name" "authorization") }}:{{ (index $.Values.services "authorization").port }}/"
            - name: Gateway__Services__audit
              value: "http://{{ include "nerves.serviceFullname" (dict "root" $ "name" "audit") }}:{{ (index $.Values.services "audit").port }}/"
            - name: Gateway__Services__directory
              value: "http://{{ include "nerves.serviceFullname" (dict "root" $ "name" "directory") }}:{{ (index $.Values.services "directory").port }}/"
            - name: Gateway__Services__notification
              value: "http://{{ include "nerves.serviceFullname" (dict "root" $ "name" "notification") }}:{{ (index $.Values.services "notification").port }}/"
            - name: Gateway__Services__compliance
              value: "http://{{ include "nerves.serviceFullname" (dict "root" $ "name" "compliance") }}:{{ (index $.Values.services "compliance").port }}/"
            - name: Gateway__Services__idp
              value: "http://{{ include "nerves.serviceFullname" (dict "root" $ "name" "idp") }}:{{ (index $.Values.services "idp").port }}/"
            {{- end }}
            {{- if eq $name "notification" }}
            - name: Smtp__Disabled
              value: {{ $.Values.config.notification.smtp.disabled | quote }}
            - name: Smtp__Host
              value: {{ $.Values.config.notification.smtp.host | quote }}
            - name: Smtp__Port
              value: {{ $.Values.config.notification.smtp.port | quote }}
            - name: Smtp__From
              value: {{ $.Values.config.notification.smtp.from | quote }}
            - name: Smtp__Tls
              value: {{ $.Values.config.notification.smtp.tls | quote }}
            - name: Smtp__User
              value: {{ $.Values.config.notification.smtp.user | quote }}
            {{- with $.Values.config.notification.smtp }}
            {{- if .existingSecret }}
            - name: Smtp__Password
              valueFrom:
                secretKeyRef:
                  name: {{ .existingSecret }}
                  key: {{ .passwordSecretKey }}
            {{- end }}
            {{- end }}
            - name: Delivery__SweepSeconds
              value: {{ $.Values.config.notification.delivery.sweepSeconds | quote }}
            - name: Delivery__MaxAttempts
              value: {{ $.Values.config.notification.delivery.maxAttempts | quote }}
            - name: Delivery__BaseDelaySeconds
              value: {{ $.Values.config.notification.delivery.baseDelaySeconds | quote }}
            - name: Delivery__MaxDelaySeconds
              value: {{ $.Values.config.notification.delivery.maxDelaySeconds | quote }}
            - name: Delivery__BatchSize
              value: {{ $.Values.config.notification.delivery.batchSize | quote }}
            {{- end }}
            {{- range (default (list) $svc.extraEnv) }}
            - {{ toYaml . | nindent 14 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if or (eq $name "identity") (eq $name "idp") }}
            - name: dp-keys
              mountPath: /var/lib/nerves/dp-keys
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if or (eq $name "identity") (eq $name "idp") }}
        - name: dp-keys
          persistentVolumeClaim:
            claimName: {{ include "nerves.dpClaimName" (dict "root" $ "name" $name) }}
        {{- end }}
      {{- with $svc.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $svc.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $svc.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
