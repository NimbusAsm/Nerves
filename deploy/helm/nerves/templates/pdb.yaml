{{- if .Values.podDisruptionBudget.enabled }}
{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "nerves.serviceFullname" (dict "root" $ "name" $name) }}
  labels:
    {{- include "nerves.labels" (dict "root" $ "name" $name) | nindent 4 }}
spec:
  {{- $minAvailable := toString $.Values.podDisruptionBudget.minAvailable }}
  {{- $maxUnavailable := toString $.Values.podDisruptionBudget.maxUnavailable }}
  {{- if ne $minAvailable "" }}
  minAvailable: {{ $minAvailable }}
  {{- else }}
  maxUnavailable: {{ default "1" $maxUnavailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "nerves.selectorLabels" (dict "root" $ "name" $name) | nindent 6 }}
{{- end }}
{{- end }}
{{- end }}
