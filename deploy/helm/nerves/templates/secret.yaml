{{- if not .Values.database.existingSecret }}
{{- $fullname := include "nerves.fullname" . }}
{{- $password := "" }}
{{- if .Values.postgresql.enabled }}
{{- $password = include "nerves.postgresqlPassword" . }}
{{- end }}
{{- $connectionString := "" }}
{{- if .Values.database.url }}
{{- $connectionString = .Values.database.url }}
{{- else if .Values.postgresql.enabled }}
{{- $connectionString = printf "Host=%s-postgresql;Port=%v;Database=%s;Username=%s;Password=%s" $fullname .Values.postgresql.service.port .Values.postgresql.auth.database .Values.postgresql.auth.username $password }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-database
  labels:
    {{- include "nerves.labels" (dict "root" . "name" "database") | nindent 4 }}
type: Opaque
data:
  {{ .Values.database.secretKey }}: {{ $connectionString | b64enc | quote }}
  {{- if .Values.postgresql.enabled }}
  postgres-password: {{ $password | b64enc | quote }}
  {{- end }}
{{- end }}
{{- if or .Values.nats.enabled .Values.nats.url }}
{{- $fullname := include "nerves.fullname" . }}
{{- $token := "" }}
{{- $url := .Values.nats.url }}
{{- if .Values.nats.enabled }}
{{- $token = include "nerves.natsToken" . }}
{{- $url = printf "nats://%s@%s-nats:%v" $token $fullname .Values.nats.service.port }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-nats
  labels:
    {{- include "nerves.labels" (dict "root" . "name" "nats") | nindent 4 }}
type: Opaque
data:
  {{ .Values.nats.urlSecretKey }}: {{ $url | b64enc | quote }}
  {{- if .Values.nats.enabled }}
  token: {{ $token | b64enc | quote }}
  {{- end }}
{{- end }}
