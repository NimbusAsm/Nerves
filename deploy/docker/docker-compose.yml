# Development stack: every service plus its database.
# Production uses the Helm chart in deploy/helm.
name: nerves-dev

x-service: &service
  build:
    context: ../..
    dockerfile: deploy/docker/Dockerfile
  environment:
    ASPNETCORE_ENVIRONMENT: Development
    ConnectionStrings__Default: Host=postgres;Port=5432;Database=nerves;Username=nerves;Password=nerves
    Authentication__Authority: http://idp:8080
    Authentication__Issuer: http://127.0.0.1:5101/
    Authentication__Audience: nerves.api
    Database__MigrateOnStart: "true"
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: nerves
      POSTGRES_PASSWORD: nerves
      POSTGRES_DB: nerves
    ports:
      - "127.0.0.1:55440:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nerves -d nerves"]
      interval: 5s
      timeout: 3s
      retries: 20

  gateway:
    <<: *service
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        PROJECT: src/services/Nerves.Gateway/Nerves.Gateway.csproj
        ENTRY_DLL: Nerves.Gateway.dll
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__MigrateOnStart: "true"
      DevSeed__Enabled: "true"
      Kestrel__Endpoints__Http__Url: http://0.0.0.0:8080
      Kestrel__Endpoints__Http__Protocols: Http1
      ReverseProxy__Clusters__identity__Destinations__primary__Address: http://identity:8080/
      ReverseProxy__Clusters__session__Destinations__primary__Address: http://session:8080/
      ReverseProxy__Clusters__authorization__Destinations__primary__Address: http://authorization:8080/
      ReverseProxy__Clusters__audit__Destinations__primary__Address: http://audit:8080/
      ReverseProxy__Clusters__directory__Destinations__primary__Address: http://directory:8080/
      ReverseProxy__Clusters__compliance__Destinations__primary__Address: http://compliance:8080/
    ports: ["5100:8080"]
    depends_on:
      postgres:
        condition: service_healthy
      identity:
        condition: service_started
      session:
        condition: service_started
      authorization:
        condition: service_started
      audit:
        condition: service_started
      directory:
        condition: service_started
      compliance:
        condition: service_started

  idp:
    <<: *service
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        PROJECT: src/services/Nerves.Idp/Nerves.Idp.csproj
        ENTRY_DLL: Nerves.Idp.dll
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=nerves;Username=nerves;Password=nerves
      OpenIddict__Issuer: http://127.0.0.1:5101/
      Database__MigrateOnStart: "true"
      Identity__GrpcAddress: http://identity:5202
      Session__GrpcAddress: http://session:5203
      Authorization__GrpcAddress: http://authorization:5204
      Audit__GrpcAddress: http://audit:5205
      DataProtection__KeysDirectory: /var/lib/nerves/dp-keys
      Kestrel__Endpoints__Http__Url: http://0.0.0.0:8080
    ports: ["5101:8080"]
    volumes:
      - idp-keys:/var/lib/nerves/dp-keys
    depends_on:
      postgres:
        condition: service_healthy
      identity:
        condition: service_started
      session:
        condition: service_started
      authorization:
        condition: service_started
      audit:
        condition: service_started

  identity:
    <<: *service
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        PROJECT: src/services/Nerves.Identity/Nerves.Identity.csproj
        ENTRY_DLL: Nerves.Identity.dll
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=nerves;Username=nerves;Password=nerves
      Authentication__Authority: http://idp:8080
      Authentication__Audience: nerves.api
      Database__MigrateOnStart: "true"
      Authentication__Issuer: http://127.0.0.1:5101/
      DataProtection__KeysDirectory: /var/lib/nerves/dp-keys
      Kestrel__Endpoints__Http__Url: http://0.0.0.0:8080
      Kestrel__Endpoints__Grpc__Url: http://0.0.0.0:5202
      Kestrel__Endpoints__Grpc__Protocols: Http2
    ports: ["5102:8080", "5202:5202"]
    volumes:
      - identity-keys:/var/lib/nerves/dp-keys

  session:
    <<: *service
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        PROJECT: src/services/Nerves.Session/Nerves.Session.csproj
        ENTRY_DLL: Nerves.Session.dll
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=nerves;Username=nerves;Password=nerves
      Authentication__Authority: http://idp:8080
      Authentication__Audience: nerves.api
      Database__MigrateOnStart: "true"
      Authentication__Issuer: http://127.0.0.1:5101/
      Kestrel__Endpoints__Http__Url: http://0.0.0.0:8080
      Kestrel__Endpoints__Grpc__Url: http://0.0.0.0:5203
      Kestrel__Endpoints__Grpc__Protocols: Http2
    ports: ["5103:8080", "5203:5203"]

  authorization:
    <<: *service
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        PROJECT: src/services/Nerves.Authorization/Nerves.Authorization.csproj
        ENTRY_DLL: Nerves.Authorization.dll
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=nerves;Username=nerves;Password=nerves
      Authentication__Authority: http://idp:8080
      Authentication__Audience: nerves.api
      Database__MigrateOnStart: "true"
      Authentication__Issuer: http://127.0.0.1:5101/
      Kestrel__Endpoints__Http__Url: http://0.0.0.0:8080
      Kestrel__Endpoints__Grpc__Url: http://0.0.0.0:5204
      Kestrel__Endpoints__Grpc__Protocols: Http2
    ports: ["5104:8080", "5204:5204"]

  audit:
    <<: *service
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        PROJECT: src/services/Nerves.Audit/Nerves.Audit.csproj
        ENTRY_DLL: Nerves.Audit.dll
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=nerves;Username=nerves;Password=nerves
      Authentication__Authority: http://idp:8080
      Authentication__Audience: nerves.api
      Database__MigrateOnStart: "true"
      Authentication__Issuer: http://127.0.0.1:5101/
      Archive__Directory: /var/lib/nerves/audit-archive
      Kestrel__Endpoints__Http__Url: http://0.0.0.0:8080
      Kestrel__Endpoints__Grpc__Url: http://0.0.0.0:5205
      Kestrel__Endpoints__Grpc__Protocols: Http2
    ports: ["5105:8080", "5205:5205"]
    volumes:
      - audit-archive:/var/lib/nerves/audit-archive

  directory:
    <<: *service
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        PROJECT: src/services/Nerves.Directory/Nerves.Directory.csproj
        ENTRY_DLL: Nerves.Directory.dll
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=nerves;Username=nerves;Password=nerves
      Authentication__Authority: http://idp:8080
      Authentication__Audience: nerves.api
      Database__MigrateOnStart: "true"
      Authentication__Issuer: http://127.0.0.1:5101/
      Kestrel__Endpoints__Http__Url: http://0.0.0.0:8080
      Kestrel__Endpoints__Grpc__Url: http://0.0.0.0:5206
      Kestrel__Endpoints__Grpc__Protocols: Http2
    ports: ["5106:8080", "5206:5206"]

  compliance:
    <<: *service
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        PROJECT: src/services/Nerves.ComplianceCn/Nerves.ComplianceCn.csproj
        ENTRY_DLL: Nerves.ComplianceCn.dll
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=nerves;Username=nerves;Password=nerves
      Authentication__Authority: http://idp:8080
      Authentication__Audience: nerves.api
      Database__MigrateOnStart: "true"
      Authentication__Issuer: http://127.0.0.1:5101/
      Kestrel__Endpoints__Http__Url: http://0.0.0.0:8080
    ports: ["5107:8080"]

volumes:
  pgdata:
  audit-archive:
  identity-keys:
  idp-keys:
