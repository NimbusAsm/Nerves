# Development dependencies only. Application services are added as they become runnable.
name: nerves-dev

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: nerves
      POSTGRES_PASSWORD: nerves
      POSTGRES_DB: nerves
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nerves -d nerves"]
      interval: 5s
      timeout: 3s
      retries: 20

  nats:
    image: nats:2.15.2-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
