syntax = "proto3";

package nerves.identity.v1;

option csharp_namespace = "Nerves.Contracts.Identity.V1";

// Identity service owns legal entities, network accounts and credentials.
service IdentityService {
  rpc GetServiceInfo(GetServiceInfoRequest) returns (GetServiceInfoResponse);
  rpc VerifyCredential(VerifyCredentialRequest) returns (VerifyCredentialResponse);
  rpc GetAccount(GetAccountRequest) returns (GetAccountResponse);
  rpc ListAccountPermissions(ListAccountPermissionsRequest) returns (ListAccountPermissionsResponse);
  rpc HasActiveTotp(HasActiveTotpRequest) returns (HasActiveTotpResponse);
  rpc VerifyMfa(VerifyMfaRequest) returns (VerifyMfaResponse);
  rpc ResolveIdentifier(ResolveIdentifierRequest) returns (ResolveIdentifierResponse);
  rpc HasActivePasskey(HasActivePasskeyRequest) returns (HasActivePasskeyResponse);
  rpc StartPasskeyAssertion(StartPasskeyAssertionRequest) returns (StartPasskeyAssertionResponse);
  rpc CompletePasskeyAssertion(CompletePasskeyAssertionRequest) returns (CompletePasskeyAssertionResponse);
}

message GetServiceInfoRequest {}

message GetServiceInfoResponse {
  string name = 1;
  string version = 2;
  string contract_version = 3;
}

message VerifyCredentialRequest {
  // Realm scoped username, email or phone number.
  string identifier = 1;
  string password = 2;
  string realm = 3;
}

message VerifyCredentialResponse {
  bool verified = 1;
  // Populated only when verified.
  string account_id = 2;
  string legal_entity_id = 3;
  string display_name = 4;
  string failure_code = 5;
  string email = 6;
}

message GetAccountRequest {
  string account_id = 1;
}

message GetAccountResponse {
  string account_id = 1;
  string legal_entity_id = 2;
  string realm = 3;
  string username = 4;
  string display_name = 5;
  string status = 6;
  bool email_verified = 7;
}

message ListAccountPermissionsRequest {
  string account_id = 1;
}

message ListAccountPermissionsResponse {
  repeated string permissions = 1;
  int64 authorization_version = 2;
}

message HasActiveTotpRequest {
  string account_id = 1;
}

message HasActiveTotpResponse {
  bool active = 1;
}

message VerifyMfaRequest {
  string account_id = 1;
  string code = 2;
}

message VerifyMfaResponse {
  bool valid = 1;
  // "totp" or "recovery"
  string method = 3;
}

message ResolveIdentifierRequest {
  // username, email or phone
  string identifier_type = 1;
  string realm = 2;
  string value = 3;
}

message ResolveIdentifierResponse {
  bool found = 1;
  string account_id = 2;
  string legal_entity_id = 3;
  string realm = 4;
  string display_name = 5;
  string email = 6;
}

message HasActivePasskeyRequest {
  string account_id = 1;
}

message HasActivePasskeyResponse {
  bool active = 1;
}

message StartPasskeyAssertionRequest {
  string account_id = 1;
}

message StartPasskeyAssertionResponse {
  string options_json = 1;
  string challenge_id = 2;
}

message CompletePasskeyAssertionRequest {
  string account_id = 1;
  string challenge_id = 2;
  string assertion_json = 3;
}

message CompletePasskeyAssertionResponse {
  bool valid = 1;
}
