syntax = "proto3";

package nerves.identity.v1;

option csharp_namespace = "Nerves.Contracts.Identity.V1";

// Identity service owns LegalEntity and NetworkAccount.
service IdentityService {
  rpc GetServiceInfo(GetServiceInfoRequest) returns (ServiceInfoReply);
}

message GetServiceInfoRequest {}

message ServiceInfoReply {
  string name = 1;
  string version = 2;
  string contract_version = 3;
}
