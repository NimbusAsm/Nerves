syntax = "proto3";

package nerves.audit.v1;

option csharp_namespace = "Nerves.Contracts.Audit.V1";

// Audit service stores append-only, hash-chained events.
service AuditService {
  rpc GetServiceInfo(GetServiceInfoRequest) returns (GetServiceInfoResponse);
  rpc Append(AppendRequest) returns (AppendResponse);
}

message GetServiceInfoRequest {}

message GetServiceInfoResponse {
  string name = 1;
  string version = 2;
  string contract_version = 3;
}

message AppendRequest {
  string stream = 1;
  string actor_type = 2;
  string actor_id = 3;
  string action = 4;
  string target_type = 5;
  string target_id = 6;
  string result = 7;
  string ip_hash = 8;
  string trace_id = 9;
  string detail_json = 10;
}

message AppendResponse {
  string event_id = 1;
  int64 sequence = 2;
  string hash = 3;
}
